<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EBFBFA" />
      <stop offset="1" stop-color="#D3F4F1" />
    </linearGradient>
    <linearGradient id="accent" x1="250" y1="140" x2="550" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#008080" />
      <stop offset="1" stop-color="#004D40" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" rx="40" fill="url(#bg)" />
  <!-- Phone shell with rounded edges -->
  <rect x="290" y="100" width="220" height="400" rx="40" fill="#004D40" />
  <rect x="294" y="104" width="212" height="392" rx="36" fill="#FFFFFF" stroke="#00796B" stroke-width="3" />
  <!-- Screen area -->
  <rect x="304" y="118" width="192" height="364" rx="28" fill="#002422" />
  <!-- Top notched camera hole -->
  <circle cx="400" cy="135" r="5" fill="#333333" />
  <!-- Motorola batwing logo stylized style -->
  <circle cx="400" cy="300" r="45" stroke="#008080" stroke-width="3" fill="none" opacity="0.3" />
  <path d="M380 305 Q390 280 400 305 Q410 280 420 305" stroke="#008080" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- Brand text -->
  <text x="400" y="540" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="bold" font-size="24" fill="#004D40" letter-spacing="6">MOTOROLA</text>
</svg>
