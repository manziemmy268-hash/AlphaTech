<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCF9F2" />
      <stop offset="1" stop-color="#F3EAD3" />
    </linearGradient>
    <linearGradient id="accent" x1="250" y1="140" x2="550" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C5A059" />
      <stop offset="1" stop-color="#8C6B30" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" rx="40" fill="url(#bg)" />
  <!-- Phone shell -->
  <rect x="290" y="100" width="220" height="400" rx="36" fill="#8C6B30" />
  <rect x="294" y="104" width="212" height="392" rx="32" fill="#FFFFFF" stroke="#C5A059" stroke-width="3" />
  <!-- Curved edge screen look -->
  <rect x="302" y="116" width="196" height="368" rx="26" fill="#1C180E" />
  <!-- Premium circular camera cluster art -->
  <circle cx="400" cy="300" r="50" stroke="#C5A059" stroke-width="2" fill="none" opacity="0.4" />
  <polygon points="400,270 425,315 375,315" fill="url(#accent)" opacity="0.3" />
  <!-- Brand text -->
  <text x="400" y="540" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="bold" font-size="26" fill="#8C6B30" letter-spacing="8">HONOR</text>
</svg>
