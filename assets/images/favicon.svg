<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0057ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" ry="7" fill="url(#bg)"/>
  <!-- Phone body -->
  <rect x="10" y="5" width="12" height="20" rx="2.5" ry="2.5" fill="none" stroke="white" stroke-width="1.8"/>
  <!-- Phone screen -->
  <rect x="11.5" y="7.5" width="9" height="13" rx="1" fill="white" opacity="0.25"/>
  <!-- Home bar -->
  <line x1="14" y1="28" x2="18" y2="28" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- A letter on screen -->
  <path d="M13.5 22 L16 10 L18.5 22" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="14.5" y1="17.5" x2="17.5" y2="17.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
</svg>
