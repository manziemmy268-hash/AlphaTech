<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2F6FC" />
      <stop offset="1" stop-color="#E1EBF7" />
    </linearGradient>
    <linearGradient id="accent" x1="250" y1="140" x2="550" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1241C1" />
      <stop offset="1" stop-color="#071F60" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" rx="40" fill="url(#bg)" />
  <!-- Phone shell -->
  <rect x="290" y="110" width="220" height="380" rx="32" fill="#071F60" />
  <rect x="295" y="115" width="210" height="370" rx="28" fill="#FFFFFF" stroke="#0B2C82" stroke-width="4" />
  <!-- Screen area -->
  <rect x="305" y="130" width="190" height="320" rx="20" fill="#091B4F" />
  <!-- Top notch speaker -->
  <rect x="370" y="140" width="60" height="6" rx="3" fill="#FFFFFF" opacity="0.3" />
  <!-- Minimalist Nokia pattern -->
  <path d="M330 200 L470 200 M330 230 L430 230 M330 260 L400 260" stroke="#1241C1" stroke-width="4" stroke-linecap="round" opacity="0.4" />
  <circle cx="440" cy="380" r="40" fill="url(#accent)" opacity="0.2" />
  <circle cx="360" cy="340" r="20" fill="url(#accent)" opacity="0.1" />
  <!-- Brand text -->
  <text x="400" y="535" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="bold" font-size="26" fill="#1241C1" letter-spacing="6">NOKIA</text>
</svg>
