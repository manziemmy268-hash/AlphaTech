<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A1A1A" />
      <stop offset="1" stop-color="#0F0F0F" />
    </linearGradient>
    <linearGradient id="accent" x1="250" y1="140" x2="550" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C4DFF" />
      <stop offset="1" stop-color="#3F51B5" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" rx="40" fill="url(#bg)" />
  <!-- Phone shell (Sony's classic tall form factor) -->
  <rect x="300" y="90" width="200" height="420" rx="20" fill="#2E2E2E" />
  <rect x="304" y="94" width="192" height="412" rx="17" fill="#1C1C1C" stroke="#444444" stroke-width="2" />
  <!-- Screen area (Tall 21:9) -->
  <rect x="312" y="112" width="176" height="376" rx="10" fill="#0D0D0D" />
  <!-- Top speaker -->
  <rect x="375" y="102" width="50" height="4" rx="2" fill="#888888" />
  <!-- Abstract camera display UI/graphic -->
  <circle cx="400" cy="300" r="50" stroke="url(#accent)" stroke-width="3" fill="none" opacity="0.6" />
  <circle cx="400" cy="300" r="30" fill="url(#accent)" opacity="0.2" />
  <path d="M370 300 H430 M400 270 V330" stroke="#7C4DFF" stroke-width="1" opacity="0.4" />
  <!-- Brand text -->
  <text x="400" y="550" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="bold" font-size="26" fill="#FFFFFF" letter-spacing="8">SONY</text>
</svg>
