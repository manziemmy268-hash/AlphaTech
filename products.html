<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse premium smartphones at AlphaTech with smart filters, detailed specs, and a fast, trustworthy shopping experience.">
    <title>Store | AlphaTech</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="dns-prefetch" href="https://alphatech-hu3y.onrender.com">
    <link rel="preconnect" href="https://alphatech-hu3y.onrender.com">
    <script src="js/auth.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo"><img src="assets/images/logo.svg" alt="AlphaTech" height="42" style="vertical-align:middle;"></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html" class="active" style="color: var(--primary-color);">Store</a></li>
                <li><a href="admin.html">Admin</a></li>
                <li id="nav-auth-links"></li>
            </ul>
            <div class="nav-actions">
                <div class="search-bar">
                    <i class="fas fa-search" style="position: absolute; left: 1rem; color: var(--secondary-color);"></i>
                    <input type="text" placeholder="Search devices..." id="search-input" data-search-input>
                </div>
                <a href="cart.html" class="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cart-count">0</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="container" style="padding-top: calc(var(--navbar-height) + 2rem);">
        <header>
            <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;">Explore Devices</h1>
            <p style="color: var(--secondary-color);">Browse premium smartphones freely, then sign in when you are ready to secure your purchase.</p>
        </header>

        <button class="filter-toggle-btn" data-toggle-filters>
            <i class="fas fa-sliders-h"></i> Filters
        </button>

        <div class="store-layout">
            <aside class="filters" id="filter-panel">
                <div class="filter-section">
                    <h3>Brands</h3>
                    <div data-brands-list></div>
                </div>

                <div class="filter-section">
                    <h3>Price Range</h3>
                    <label class="filter-option">
                        <input type="radio" name="price-range" value="all" data-clear-filters> All Prices
                    </label>
                    <label class="filter-option">
                        <input type="radio" name="price-range" value="0-500"> Under $500
                    </label>
                    <label class="filter-option">
                        <input type="radio" name="price-range" value="500-1000"> $500 - $1000
                    </label>
                    <label class="filter-option">
                        <input type="radio" name="price-range" value="1000plus"> Over $1000
                    </label>
                </div>

                <div class="filter-section">
                    <h3>Categories</h3>
                    <div data-categories-list></div>
                </div>

                <button id="clear-filters-btn" class="btn" style="color: var(--primary-color); padding: 0.5rem 0; font-size: 0.9rem;">
                    Clear all filters
                </button>
            </aside>

            <section class="store-content">
                <div class="sort-row">
                    <p><span id="product-count">0</span> products found</p>
                    <div style="display: flex; align-items: center; gap: 1rem;">
                        <span>Sort by:</span>
                        <select id="sort-select" data-sort-select>
                            <option value="newest">Newest</option>
                            <option value="price_asc">Price: Low to High</option>
                            <option value="price_desc">Price: High to Low</option>
                            <option value="name_asc">Name (A-Z)</option>
                            <option value="name_desc">Name (Z-A)</option>
                            <option value="rating">Highest Rated</option>
                            <option value="popular">Most Popular</option>
                        </select>
                    </div>
                </div>

                <div class="products-grid" id="products-grid">
                    <div class="loading-state"><i class="fas fa-spinner fa-spin"></i><p>Discovering the best deals...</p></div>
                </div>

                <div id="pagination" style="margin-top: 2rem;"></div>
            </section>
        </div>

        <div id="recent-products" style="margin-top: 3rem;"></div>
    </main>

    <footer id="shared-footer"></footer>

    <script src="js/config.js?v=20260809"></script>
    <script src="js/app.js"></script>
    <script src="js/catalog/catalog-cache.js"></script>
    <script src="js/catalog/catalog-api.js"></script>
    <script src="js/catalog/catalog-state.js"></script>
    <script src="js/catalog/catalog-ui.js"></script>
    <script src="js/catalog/catalog-grid.js"></script>
    <script src="js/catalog/catalog-filters.js"></script>
    <script src="js/catalog/catalog-search.js"></script>
    <script src="js/catalog/catalog.js"></script>
    <script>fetch('js/footer.js').then(r=>r.text()).then(h=>{document.getElementById('shared-footer').outerHTML=h})</script>
    <script src="js/catalog/catalog-recent.js"></script>
    <script src="js/catalog/catalog-detail.js"></script>
    <script src="js/catalog/catalog.js"></script>
</body>
</html>
