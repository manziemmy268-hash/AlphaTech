<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Phonne</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="dns-prefetch" href="https://alphatech-hu3y.onrender.com">
    <link rel="preconnect" href="https://alphatech-hu3y.onrender.com">
    <style>
        .auth-container {
            min-height: calc(100vh - var(--navbar-height) - 100px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            margin-top: var(--navbar-height);
        }
        .auth-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 450px;
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .auth-card h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            color: var(--text-color);
        }
        .auth-card p {
            color: var(--secondary-color);
            margin-bottom: 2.5rem;
            line-height: 1.5;
        }
        .form-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-color);
        }
        .form-control {
            width: 100%;
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 1rem;
            transition: var(--transition);
        }
        .form-control:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.1);
        }
        .auth-btn {
            width: 100%;
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }
        .auth-footer {
            margin-top: 2rem;
            font-size: 0.95rem;
            color: var(--secondary-color);
        }
        .auth-footer a {
            color: var(--primary-color);
            font-weight: 600;
        }
        .message-box {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            display: none;
            text-align: left;
            line-height: 1.4;
        }
        .error { background: rgba(255, 59, 48, 0.1); color: #ff3b30; }
        .success { background: rgba(52, 199, 89, 0.1); color: #34c759; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <i class="fas fa-mobile-alt"></i> Phonne
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Store</a></li>
                <li id="nav-auth-links"></li>
            </ul>
        </div>
    </nav>

    <main class="auth-container">
        <div class="auth-card">
            <h1>Reset Your Password</h1>
            <p>Enter the email address associated with your account and we'll send you a link to reset your password.</p>
            
            <div id="message-box" class="message-box"></div>

            <form id="forgot-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
                </div>
                <button type="submit" class="btn btn-primary auth-btn">Send Recovery Link</button>
            </form>

            <div class="auth-footer">
                <a href="login.html"><i class="fas fa-arrow-left"></i> Back to Login</a>
            </div>
        </div>
    </main>

    <script src="js/config.js?v=20260809"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        const btn = document.querySelector('.auth-btn');
        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const msgBox = document.getElementById('message-box');
            const mockBox = document.getElementById('mock-email-box');
            const mockLink = document.getElementById('mock-link-href');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            msgBox.style.display = 'none';
            mockBox.style.display = 'none';

            try {
                const res = await fetch(`${Auth.API_URL}/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const result = await res.json();

                msgBox.textContent = result.message;
                msgBox.style.display = 'block';

                if (result.success) {
                    msgBox.className = "message-box success";
                } else {
                    msgBox.className = "message-box error";
                }
            } catch (err) {
                msgBox.textContent = 'Network error. Please try again later.';
                msgBox.className = "message-box error";
                msgBox.style.display = 'block';
            }

            btn.disabled = false;
            btn.innerHTML = 'Send Recovery Link';
        });
    </script>
</body>
</html>
