<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings | Phonne</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="js/auth.js"></script>
    <script>Auth.requireAuth();</script>
    <style>
        .settings-container {
            max-width: 800px;
            margin: calc(var(--navbar-height) + 2rem) auto 4rem;
            padding: 0 2rem;
            display: grid;
            gap: 2rem;
        }

        .settings-card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
        }

        .settings-card h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-color);
        }

        .form-control {
            width: 100%;
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-control:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.1);
        }

        .btn-settings {
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border: none;
        }

        .danger-zone {
            border: 1px solid rgba(255, 59, 48, 0.2);
            background: rgba(255, 59, 48, 0.02);
        }

        .danger-zone h2 {
            color: #ff3b30;
        }

        .btn-danger {
            background: #ff3b30;
            color: white;
        }

        .btn-danger:hover {
            background: #d70015;
            box-shadow: 0 10px 20px -10px rgba(255, 59, 48, 0.5);
        }

        .message-box {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            display: none;
        }

        .error { background: rgba(255, 59, 48, 0.1); color: #ff3b30; }
        .success { background: rgba(52, 199, 89, 0.1); color: #34c759; }

    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <i class="fas fa-mobile-alt"></i> Phonne
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Store</a></li>
                <li id="nav-auth-links"></li>
            </ul>
            <div class="nav-actions">
                <a href="cart.html" class="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cart-count">0</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="settings-container">
        <!-- Update Profile Details -->
        <section class="settings-card">
            <h2><i class="fas fa-user-edit"></i> Edit Profile</h2>
            <div id="update-msg" class="message-box"></div>
            
            <form id="update-form">
                <div class="form-group">
                    <label for="username">Full Name</label>
                    <input type="text" id="username" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" class="form-control" placeholder="+250 788 000 000">
                </div>
                
                <h3 style="margin: 2rem 0 1rem; font-size: 1.1rem; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 1.5rem;">Change Password (Optional)</h3>
                <div class="form-group">
                    <label for="old-password">Current Password</label>
                    <div class="password-wrapper" style="position: relative;">
                        <input type="password" id="old-password" class="form-control" placeholder="Enter current password to save changes" style="padding-right: 2.5rem;">
                        <i class="fas fa-eye toggle-password" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--secondary-color);"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <div class="password-wrapper" style="position: relative;">
                        <input type="password" id="new-password" class="form-control" placeholder="Minimum 6 characters" style="padding-right: 2.5rem;">
                        <i class="fas fa-eye toggle-password" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--secondary-color);"></i>
                    </div>
                </div>

                <button type="submit" class="btn-settings btn-primary" id="update-btn">Save Changes</button>
            </form>
        </section>

        <!-- Danger Zone (Delete Account) -->
        <section class="settings-card danger-zone">
            <h2><i class="fas fa-exclamation-triangle"></i> Danger Zone</h2>
            <p style="color: var(--secondary-color); margin-bottom: 1.5rem;">Permanently delete your account and all associated data (orders, carts, history). This action cannot be undone.</p>
            
            <div id="delete-msg" class="message-box"></div>

            <form id="delete-form">
                <div class="form-group">
                    <label for="delete-password">Confirm Current Password to Delete</label>
                    <div class="password-wrapper" style="position: relative;">
                        <input type="password" id="delete-password" class="form-control" required style="padding-right: 2.5rem;">
                        <i class="fas fa-eye toggle-password" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--secondary-color);"></i>
                    </div>
                </div>
                <button type="submit" class="btn-settings btn-danger" id="delete-btn">Permanently Delete Account</button>
            </form>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = Auth.getCurrentUser();
            if (user) {
                document.getElementById('username').value = user.username;
                if (user.phone) {
                    document.getElementById('phone').value = user.phone;
                }
            }
        });

        // Handle Profile Update
        document.getElementById('update-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('update-btn');
            const msgBox = document.getElementById('update-msg');
            
            const username = document.getElementById('username').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const oldPassword = document.getElementById('old-password').value;
            const newPassword = document.getElementById('new-password').value;

            btn.disabled = true;
            btn.innerHTML = 'Saving...';

            try {
                const res = await fetch(`${API_URL}/users/me`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${Auth.getToken()}`
                    },
                    body: JSON.stringify({ username, phone, oldPassword, newPassword })
                });
                
                const data = await res.json();
                
                msgBox.style.display = 'block';
                msgBox.textContent = data.message;
                msgBox.className = data.success ? "message-box success" : "message-box error";

                if (data.success) {
                    Auth.saveSession(data.token, data.user);
                    Auth.updateNavbar();
                    document.getElementById('old-password').value = '';
                    document.getElementById('new-password').value = '';
                }
            } catch (err) {
                msgBox.style.display = 'block';
                msgBox.className = "message-box error";
                msgBox.textContent = "Network error while saving.";
            }

            btn.disabled = false;
            btn.innerHTML = 'Save Changes';
        });

        // Handle Account Deletion
        document.getElementById('delete-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!confirm('Are you ABSOLUTELY sure you want to delete your account? This will wipe your carts and orders instantly.')) {
                return;
            }

            const btn = document.getElementById('delete-btn');
            const msgBox = document.getElementById('delete-msg');
            const password = document.getElementById('delete-password').value;

            btn.disabled = true;
            btn.innerHTML = 'Deleting...';

            try {
                const res = await fetch(`${API_URL}/users/me`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${Auth.getToken()}`
                    },
                    body: JSON.stringify({ password })
                });

                const data = await res.json();
                
                if (data.success) {
                    Auth.logout(); // Will redirect to index.html automatically
                } else {
                    msgBox.style.display = 'block';
                    msgBox.className = "message-box error";
                    msgBox.textContent = data.message;
                    btn.disabled = false;
                    btn.innerHTML = 'Permanently Delete Account';
                }
            } catch (err) {
                msgBox.style.display = 'block';
                msgBox.className = "message-box error";
                msgBox.textContent = "Network error while deleting.";
                btn.disabled = false;
                btn.innerHTML = 'Permanently Delete Account';
            }
        });
    </script>
</body>
</html>
