<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View detailed smartphone specifications, pricing, reviews, and availability before you buy.">
    <title>Product Details | Phonne</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="dns-prefetch" href="https://alphatech-hu3y.onrender.com">
    <link rel="preconnect" href="https://alphatech-hu3y.onrender.com">
    <script src="js/auth.js"></script>
    <style>
        .product-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            margin-top: 3rem;
            align-items: center;
        }

        .product-gallery img {
            width: 100%;
            height: auto;
            border-radius: 20px;
            box-shadow: var(--shadow);
            background: #fff;
            padding: 2rem;
        }

        .product-info-header {
            margin-bottom: 2rem;
        }

        .product-info-header h1 {
            font-size: 3rem;
            margin: 0.5rem 0;
        }

        .product-info-header .price {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .specs-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .spec-item {
            padding: 1rem;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .spec-item i {
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            display: block;
        }

        .spec-item span {
            font-size: 0.8rem;
            color: var(--secondary-color);
            text-transform: uppercase;
        }

        .spec-item p {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .stock-badge {
            display: inline-block;
            padding: 0.4rem 1rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .stock-in { background: #e6fcf5; color: #099268; }
        .stock-low { background: #fff9db; color: #f08c00; }
        .stock-out { background: #fff5f5; color: #fa5252; }

        .reviews-section {
            margin-top: 5rem;
            padding-top: 3rem;
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        .review-card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 20px;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow);
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .stars { color: #fcc419; }
        .stars .far { color: #dee2e6; }

        .write-review-card {
            background: #f8f9fa;
            padding: 2rem;
            border-radius: 20px;
            margin-top: 2rem;
            border: 2px dashed #dee2e6;
        }

        .rating-input {
            display: flex;
            gap: 0.5rem;
            font-size: 1.5rem;
            cursor: pointer;
            margin: 1rem 0;
        }

        .rating-input i:hover,
        .rating-input i.active { color: #fcc419; }

        @media (max-width: 768px) {
            .product-detail {
                grid-template-columns: 1fr !important;
                gap: 2rem !important;
            }
            .product-details {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
            .product-info-header h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <i class="fas fa-mobile-alt"></i> Phonne
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Store</a></li>
                <li><a href="admin.html">Admin</a></li>
                <li id="nav-auth-links"></li>
            </ul>
            <div class="nav-actions">
                <div class="search-bar">
                    <i class="fas fa-search" style="position: absolute; left: 1rem; color: var(--secondary-color);"></i>
                    <input type="text" placeholder="Search devices..." id="global-search">
                </div>
                <a href="cart.html" class="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cart-count">0</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="container reveal" style="padding-top: calc(var(--navbar-height) + 2rem);">
        <nav aria-label="Breadcrumb" style="margin-bottom: 1rem; font-size: 0.85rem; color: var(--secondary-color);">
            <a href="index.html" style="color: var(--primary-color);">Home</a>
            <span> / </span>
            <a href="products.html" style="color: var(--primary-color);">Store</a>
            <span> / </span>
            <span id="breadcrumb-product-name" style="color: var(--text-color); font-weight: 500;">Product</span>
        </nav>
        <div id="product-detail">
            <div class="loading-state"><i class="fas fa-spinner fa-spin"></i><p>Loading device details...</p></div>
        </div>

        <section class="reviews-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h2>Customer Reviews</h2>
                <div id="avg-rating-display"></div>
            </div>

            <div id="reviews-list">
                <p style="color: var(--secondary-color);">No reviews yet. Sign in after purchase to share your experience and help other buyers.</p>
            </div>

            <div id="write-review-container">
            </div>
        </section>

        <div id="recent-products" style="margin-top: 3rem;"></div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-bottom" style="border: none;">
                &copy; 2026 Phonne Store. All rights reserved.
            </div>
        </div>
    </footer>

    <script src="js/config.js?v=20260809"></script>
    <script src="js/app.js"></script>
    <script src="js/catalog/catalog-cache.js"></script>
    <script src="js/catalog/catalog-api.js"></script>
    <script src="js/catalog/catalog-state.js"></script>
    <script src="js/catalog/catalog-ui.js"></script>
    <script src="js/catalog/catalog-detail.js"></script>
    <script src="js/catalog/catalog-recent.js"></script>
    <script src="js/catalog/catalog.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const productId = getQueryParam('id');
            if (!productId) {
                window.location.href = 'products.html';
                return;
            }

            const product = await fetchProductById(productId);
            if (!product) {
                document.getElementById('product-detail').innerHTML = '<h2>Product not found.</h2> <a href="products.html" class="btn btn-primary" style="margin-top: 1rem;">Back to Store</a>';
                return;
            }

            if (product.review_count !== undefined) {
                document.getElementById('avg-rating-display').innerHTML = renderStars(product.average_rating) + ' <span style="color: var(--secondary-color); font-size: 0.9rem;">' + (product.average_rating || 0).toFixed(1) + ' out of 5</span>';
            }

            loadReviews(product.id);
            checkReviewEligibility(product.id);
        });

        function renderStars(rating) {
            let html = '';
            for (let i = 1; i <= 5; i++) {
                if (i <= Math.round(rating)) {
                    html += '<i class="fas fa-star"></i>';
                } else {
                    html += '<i class="far fa-star"></i>';
                }
            }
            return html;
        }

        async function loadReviews(productId) {
            const reviewsList = document.getElementById('reviews-list');
            try {
                const res = await fetch(`${API_URL}/products/${productId}/reviews`);
                const reviews = await res.json();

                if (reviews.length > 0) {
                    reviewsList.innerHTML = reviews.map(r => `
                        <div class="review-card">
                            <div class="review-header">
                                <div>
                                    <strong style="display: block;">${escapeHtml(r.username)}</strong>
                                    <span style="font-size: 0.8rem; color: var(--secondary-color);">${new Date(r.created_at).toLocaleDateString()}</span>
                                </div>
                                <div class="stars">
                                    ${renderStars(r.rating)}
                                </div>
                            </div>
                            <p style="color: var(--text-color);">${escapeHtml(r.comment) || '<em>No comment provided.</em>'}</p>
                        </div>
                    `).join('');
                }
            } catch (err) {
                console.error('Error loading reviews:', err);
            }
        }

        async function checkReviewEligibility(productId) {
            if (!Auth.isLoggedIn()) return;

            const container = document.getElementById('write-review-container');

            try {
                const res = await fetch(`${API_URL}/orders`, {
                    headers: { 'Authorization': `Bearer ${Auth.getToken()}` }
                });
                const orders = await res.json();

                const hasPurchased = orders.some(o => o.status === 'paid' && o.id);

                renderReviewForm(productId);
            } catch (err) {
                console.error('Eligibility check failed:', err);
            }
        }

        function renderReviewForm(productId) {
            const container = document.getElementById('write-review-container');
            container.innerHTML = `
                <div class="write-review-card">
                    <h3>Share Your Experience</h3>
                    <p style="font-size: 0.9rem; color: var(--secondary-color);">Only verified buyers can submit reviews.</p>

                    <div class="rating-input" id="rating-input">
                        <i class="far fa-star" data-value="1"></i>
                        <i class="far fa-star" data-value="2"></i>
                        <i class="far fa-star" data-value="3"></i>
                        <i class="far fa-star" data-value="4"></i>
                        <i class="far fa-star" data-value="5"></i>
                    </div>

                    <textarea id="review-comment" class="form-control" style="width: 100%; min-height: 100px; padding: 1rem; border-radius: 10px; border: 1px solid #dee2e6; margin-bottom: 1rem;" placeholder="What did you think of the device?"></textarea>

                    <button class="btn btn-primary" onclick="submitReview(${productId})">Submit Review</button>
                </div>
            `;

            const stars = container.querySelectorAll('.rating-input i');
            let selectedRating = 0;

            stars.forEach(star => {
                star.addEventListener('click', () => {
                    selectedRating = parseInt(star.dataset.value);
                    stars.forEach((s, idx) => {
                        if (idx < selectedRating) {
                            s.className = 'fas fa-star active';
                        } else {
                            s.className = 'far fa-star';
                        }
                    });
                    container.dataset.rating = selectedRating;
                });

                star.addEventListener('mouseover', () => {
                    const val = parseInt(star.dataset.value);
                    stars.forEach((s, idx) => {
                        if (idx < val) s.className = 'fas fa-star';
                    });
                });

                star.addEventListener('mouseout', () => {
                    stars.forEach((s, idx) => {
                        if (idx < selectedRating) s.className = 'fas fa-star active';
                        else s.className = 'far fa-star';
                    });
                });
            });
        }

        async function submitReview(productId) {
            const rating = document.getElementById('write-review-container').dataset.rating;
            const comment = document.getElementById('review-comment').value;

            if (!rating) {
                showToast('Please select a star rating.');
                return;
            }

            try {
                const res = await fetch(`${API_URL}/reviews`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${Auth.getToken()}`
                    },
                    body: JSON.stringify({ product_id: productId, rating, comment })
                });
                const result = await res.json();

                if (result.success) {
                    showToast('Review submitted! Thank you.');
                    location.reload();
                } else {
                    showToast(result.message);
                }
            } catch (err) {
                showToast('Error submitting review.');
            }
        }
    </script>
</body>
</html>
