<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View detailed smartphone specifications, pricing, reviews, and availability before you buy.">
    <title>Product Details | Phonne</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="js/auth.js"></script>
    <style>
        .product-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            margin-top: 3rem;
            align-items: center;
        }

        .product-gallery img {
            width: 100%;
            height: auto;
            border-radius: 20px;
            box-shadow: var(--shadow);
            background: #fff;
            padding: 2rem;
        }

        .product-info-header {
            margin-bottom: 2rem;
        }

        .product-info-header h1 {
            font-size: 3rem;
            margin: 0.5rem 0;
        }

        .product-info-header .price {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .specs-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .spec-item {
            padding: 1rem;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .spec-item i {
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            display: block;
        }

        .spec-item span {
            font-size: 0.8rem;
            color: var(--secondary-color);
            text-transform: uppercase;
        }

        .spec-item p {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .stock-badge {
            display: inline-block;
            padding: 0.4rem 1rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .stock-in { background: #e6fcf5; color: #099268; }
        .stock-low { background: #fff9db; color: #f08c00; }
        .stock-out { background: #fff5f5; color: #fa5252; }

        /* Reviews Section */
        .reviews-section {
            margin-top: 5rem;
            padding-top: 3rem;
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        .review-card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 20px;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow);
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .stars { color: #fcc419; }
        .stars .far { color: #dee2e6; }

        .write-review-card {
            background: #f8f9fa;
            padding: 2rem;
            border-radius: 20px;
            margin-top: 2rem;
            border: 2px dashed #dee2e6;
        }

        .rating-input {
            display: flex;
            gap: 0.5rem;
            font-size: 1.5rem;
            cursor: pointer;
            margin: 1rem 0;
        }

        .rating-input i:hover, 
        .rating-input i.active { color: #fcc419; }

        @media (max-width: 768px) {
            .product-details {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
            .product-info-header h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <i class="fas fa-mobile-alt"></i> Phonne
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Store</a></li>
                <li><a href="admin.html">Admin</a></li>
                <li id="nav-auth-links"></li>
            </ul>
            <div class="nav-actions">
                <div class="search-bar">
                    <i class="fas fa-search" style="position: absolute; left: 1rem; color: var(--secondary-color);"></i>
                    <input type="text" placeholder="Search devices..." id="global-search">
                </div>
                <a href="cart.html" class="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cart-count">0</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="container reveal" style="padding-top: calc(var(--navbar-height) + 2rem);">
        <div id="product-detail-container">
            <div class="loading-state"><i class="fas fa-spinner fa-spin"></i><p>Loading device details...</p></div>
        </div>

        <section class="reviews-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h2>Customer Reviews</h2>
                <div id="avg-rating-display"></div>
            </div>
            
            <div id="reviews-list">
                <p style="color: var(--secondary-color);">No reviews yet. Sign in after purchase to share your experience and help other buyers.</p>
            </div>

            <div id="write-review-container">
                <!-- Will be shown only if user is verified buyer -->
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="footer-bottom" style="border: none;">
                &copy; 2024 Phonne Store. All rights reserved.
            </div>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const productId = getQueryParam('id');
            if (!productId) {
                window.location.href = 'products.html';
                return;
            }
            
            const product = await fetchProductById(productId);
            if (!product) {
                document.getElementById('product-detail-container').innerHTML = '<h2>Product not found.</h2> <a href="products.html" class="btn btn-primary" style="margin-top: 1rem;">Back to Store</a>';
                return;
            }
            renderProduct(product);
        });

        function renderProduct(product) {
            const container = document.getElementById('product-detail-container');
            
            // Determine stock status
            let stockClass = 'stock-in';
            let stockText = 'In Stock';
            if (product.stock === 0) {
                stockClass = 'stock-out';
                stockText = 'Out of Stock';
            } else if (product.stock <= 3) {
                stockClass = 'stock-low';
                stockText = `Hurry! Only ${product.stock} left`;
            }

            container.innerHTML = `
                <div class="product-details">
                    <div class="product-gallery">
                        <img src="${getProductImageSrc(product.image)}" alt="${product.name}" onerror="handleProductImageError(this)">
                    </div>
                    <div class="product-info">
                        <div class="product-info-header">
                            <span class="stock-badge ${stockClass}">${stockText}</span><br>
                            <span class="product-brand">${product.brand}</span>
                            <h1>${product.name}</h1>
                            <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;">
                                ${renderStars(product.average_rating || 0)}
                                <span style="color: var(--secondary-color); font-size: 0.9rem;">(${product.review_count || 0} reviews)</span>
                            </div>
                            <p class="price">$${product.price}</p>
                        </div>
                        
                        <p style="color: var(--secondary-color); line-height: 1.8;">${product.description}</p>
                        
                        <div class="specs-grid">
                            <div class="spec-item">
                                <i class="fas fa-microchip"></i>
                                <span>Processor</span>
                                <p>${product.specs_processor || 'N/A'}</p>
                            </div>
                            <div class="spec-item">
                                <i class="fas fa-mobile-screen"></i>
                                <span>Display</span>
                                <p>${product.specs_display || 'N/A'}</p>
                            </div>
                            <div class="spec-item">
                                <i class="fas fa-camera"></i>
                                <span>Camera</span>
                                <p>${product.specs_camera || 'N/A'}</p>
                            </div>
                            <div class="spec-item">
                                <i class="fas fa-battery-full"></i>
                                <span>Battery</span>
                                <p>${product.specs_battery || 'N/A'}</p>
                            </div>
                        </div>

                        <div class="actions">
                            <button class="btn btn-primary" style="flex: 2; padding: 1.2rem;" 
                                    onclick="addToCart(${product.id})" ${product.stock === 0 ? 'disabled' : ''}>
                                ${product.stock === 0 ? 'Out of Stock' : 'Add to Cart'}
                            </button>
                            <button class="btn" style="flex: 1; border: 1px solid rgba(0,0,0,0.1);" onclick="addToWishlist(${product.id})">
                                <i class="far fa-heart" id="wishlist-icon-${product.id}"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
            
            loadReviews(product.id);
            checkReviewEligibility(product.id);
        }

        async function loadReviews(productId) {
            const reviewsList = document.getElementById('reviews-list');
            try {
                const res = await fetch(`${API_URL}/products/${productId}/reviews`);
                const reviews = await res.json();
                
                if (reviews.length > 0) {
                    reviewsList.innerHTML = reviews.map(r => `
                        <div class="review-card">
                            <div class="review-header">
                                <div>
                                    <strong style="display: block;">${r.username}</strong>
                                    <span style="font-size: 0.8rem; color: var(--secondary-color);">${new Date(r.created_at).toLocaleDateString()}</span>
                                </div>
                                <div class="stars">
                                    ${renderStars(r.rating)}
                                </div>
                            </div>
                            <p style="color: var(--text-color);">${r.comment || '<em>No comment provided.</em>'}</p>
                        </div>
                    `).join('');
                }
            } catch (err) {
                console.error('Error loading reviews:', err);
            }
        }

        async function checkReviewEligibility(productId) {
            if (!Auth.isLoggedIn()) return;
            
            const container = document.getElementById('write-review-container');
            
            // Check if user has a paid order for this product
            try {
                const res = await fetch(`${API_URL}/orders`, {
                    headers: { 'Authorization': `Bearer ${Auth.getToken()}` }
                });
                const orders = await res.json();
                
                // Find if any paid order has this product
                const hasPurchased = orders.some(o => 
                    o.status === 'paid' && o.id // We need more detailed check here or use a dedicated endpoint
                );

                // For now, let's assume if they have any order, we show the form but the backend will enforce the product-specific check
                // This is a "greedy" UI approach to encourage reviews
                renderReviewForm(productId);
            } catch (err) {
                console.error('Eligibility check failed:', err);
            }
        }

        function renderReviewForm(productId) {
            const container = document.getElementById('write-review-container');
            container.innerHTML = `
                <div class="write-review-card">
                    <h3>Share Your Experience</h3>
                    <p style="font-size: 0.9rem; color: var(--secondary-color);">Only verified buyers can submit reviews.</p>
                    
                    <div class="rating-input" id="rating-input">
                        <i class="far fa-star" data-value="1"></i>
                        <i class="far fa-star" data-value="2"></i>
                        <i class="far fa-star" data-value="3"></i>
                        <i class="far fa-star" data-value="4"></i>
                        <i class="far fa-star" data-value="5"></i>
                    </div>
                    
                    <textarea id="review-comment" class="form-control" style="width: 100%; min-height: 100px; padding: 1rem; border-radius: 10px; border: 1px solid #dee2e6; margin-bottom: 1rem;" placeholder="What did you think of the device?"></textarea>
                    
                    <button class="btn btn-primary" onclick="submitReview(${productId})">Submit Review</button>
                </div>
            `;

            // Star selection logic
            const stars = container.querySelectorAll('.rating-input i');
            let selectedRating = 0;

            stars.forEach(star => {
                star.addEventListener('click', () => {
                    selectedRating = parseInt(star.dataset.value);
                    stars.forEach((s, idx) => {
                        if (idx < selectedRating) {
                            s.className = 'fas fa-star active';
                        } else {
                            s.className = 'far fa-star';
                        }
                    });
                    container.dataset.rating = selectedRating;
                });
                
                star.addEventListener('mouseover', () => {
                    const val = parseInt(star.dataset.value);
                    stars.forEach((s, idx) => {
                        if (idx < val) s.className = 'fas fa-star';
                    });
                });

                star.addEventListener('mouseout', () => {
                    stars.forEach((s, idx) => {
                        if (idx < selectedRating) s.className = 'fas fa-star active';
                        else s.className = 'far fa-star';
                    });
                });
            });
        }

        async function submitReview(productId) {
            const rating = document.getElementById('write-review-container').dataset.rating;
            const comment = document.getElementById('review-comment').value;

            if (!rating) {
                showToast('Please select a star rating.');
                return;
            }

            try {
                const res = await fetch(`${API_URL}/reviews`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${Auth.getToken()}`
                    },
                    body: JSON.stringify({ product_id: productId, rating, comment })
                });
                const result = await res.json();
                
                if (result.success) {
                    showToast('Review submitted! Thank you.');
                    location.reload();
                } else {
                    showToast(result.message);
                }
            } catch (err) {
                showToast('Error submitting review.');
            }
        }

        function renderStars(rating) {
            let starsHtml = '';
            for (let i = 1; i <= 5; i++) {
                if (i <= Math.round(rating)) {
                    starsHtml += '<i class="fas fa-star"></i>';
                } else {
                    starsHtml += '<i class="far fa-star"></i>';
                }
            }
            return starsHtml;
        }
    </script>
</body>
</html>
